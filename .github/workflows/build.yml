name: Flatpak

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  bundle:
    name: Build bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      # Must match runtime-version in the manifest.
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      # Flathub blockers, surfaced early. Not build-blocking yet: the
      # metainfo has no screenshots until they can be captured on real
      # hardware, and that alone fails a strict AppStream validation.
      # docs/releasing.md requires these clean before submitting to Flathub.
      - name: Validate desktop entry
        continue-on-error: true
        run: desktop-file-validate data/io.github.rgbcoder001.Ignis.desktop

      - name: Validate AppStream metadata
        continue-on-error: true
        run: appstreamcli validate --no-net data/io.github.rgbcoder001.Ignis.metainfo.xml

      - name: Build Flatpak
        # TODO: pin to a commit SHA once the first green build lands.
        #
        # Known, tracked Node 20 deprecation warning here (checked
        # 2026-07-30): this action has no tagged releases at all, only this
        # floating @master ref, and @master still declares node20 in its own
        # action.yml. There is nothing to bump to. It's a harmless warning
        # until GitHub Actions removes node20 support on 2026-09-16 -
        # revisit then if flathub-infra hasn't updated it by choice, since
        # checkout/setup-python/action-gh-release above are already on
        # node24.
        uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: ignis.flatpak
          manifest-path: flatpak/io.github.rgbcoder001.Ignis.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Attach bundle to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ignis.flatpak
