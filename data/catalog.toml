[[apps]]
id = "obs"
name = "OBS Studio"
summary = "Record your screen and stream"
description = """Industry-standard software for screen recording and live \
streaming, with hardware-encoder support."""
category = "streaming"
hardware = []

[apps.source]
type = "flathub"
ref = "com.obsproject.Studio"

[[apps]]
id = "sunshine"
name = "Sunshine game streaming"
summary = "Stream games from this PC to other devices (pairs with Moonlight)"
description = """Self-hosted game-stream server using Bazzite's built-in \
setup recipe. Use the Moonlight app on the receiving device."""
category = "streaming"
hardware = []

[apps.source]
type = "ujust"
# Verified against Bazzite's 82-bazzite-sunshine.just on 2026-07-30. The
# recipe takes status | enable | enable-beta | update | disable | uninstall
# | portal; "enable" installs the Flatpak and enables the user service,
# which is what Ignis wants. Without an action it opens a menu needing a
# terminal — that is the "failed with exit code 1" people hit.
recipe = "setup-sunshine"
args = ["enable"]
uninstall_args = ["disable"]
# The recipe considers Sunshine set up when its user service is enabled.
check_cmd = ["systemctl", "is-enabled", "--user", "app-dev.lizardbyte.app.Sunshine"]

