# Ignis app catalog — data only, no code.
# Schema: SPEC.md §4.2. One bad entry is skipped with a logged warning.
#
# !! Every entry below is a SEED and must be verified on a real Bazzite
# !! machine during Phase 2: check Flathub refs on flathub.org, and check
# !! ujust recipe names against `ujust` output on current Bazzite.

