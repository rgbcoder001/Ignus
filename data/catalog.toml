# ── Emulation ─────────────────────────────────────────────────────────

[[apps]]
id = "emudeck"
name = "EmuDeck"
summary = "All-in-one emulation setup"
description = """Installs and configures a full retro-emulation environment \
using Bazzite's built-in recipe."""
category = "emulation"
hardware = []

[apps.source]
type = "ujust"
# Recipe name confirmed current as of 2026-07 (docs.bazzite.gg + community
# reports). Still VERIFY check_cmd's marker path on Bazzite.
recipe = "install-emudeck"
check_cmd = ["test", "-d", "/home/.emudeck"]  # VERIFY marker path

[[apps]]
id = "githublauncher"
name = "GitHub Launcher"
summary = "Install and update recompiled/decompiled PC ports"
description = """Manages games and apps published on GitHub — including the \
recomp and decomp PC ports such as Zelda 64: Recompiled — downloading them \
and keeping them updated. Ignis installs the launcher itself; you pick the \
games from inside it.

Ports built this way need you to legally provide your own copy of the \
original game."""
category = "emulation"
hardware = []

[apps.source]
type = "github"
repo = "SirDiabo/GithubLauncher"
# Verified against the real v1.73 release on 2026-07-30: matches exactly one
# asset (GitHubLauncher-v1.73-Linux-X64.zip); the ARM64 and Windows builds
# correctly do not match. If upstream renames these, Ignis fails loudly and
# names every asset it saw rather than guessing.
#
# The Linux build is a self-contained single-file .NET publish (the runtime
# is embedded in the 83 MB executable - confirmed, no separate .dll files),
# so it needs NO .NET installation on Bazzite. Its three sibling .so files
# are Avalonia's native deps and must be extracted alongside it.
asset_pattern = 'linux-x64\.zip$'
install_kind = "zip"

