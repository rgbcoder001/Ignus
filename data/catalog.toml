# Ignis app catalog — data only, no code.
# Schema: SPEC.md §4.2. One bad entry is skipped with a logged warning.
#
# Writing descriptions: the audience is someone who has just moved from
# Windows and does not consider themselves technical. Say what the app does,
# why they might want it, and — where it matters — when they can safely skip
# it. Compare to the Windows equivalent when that makes it click faster.
# Avoid jargon, and never assume they know what a Flatpak or a runtime is.

# ── Gaming ────────────────────────────────────────────────────────────

[[apps]]
id = "heroic"
name = "Heroic Games Launcher"
summary = "Play your Epic, GOG and Amazon games"
description = """If you bought games on the Epic Games Store or GOG, or \
claimed them free with Amazon Prime, this is how you play them here. It \
signs into those stores, downloads your games, and quietly handles the work \
of making Windows games run on Linux — you just press Play.

Your Steam games do not need this. Steam is already installed and handles \
them itself."""
category = "gaming"
hardware = []

[apps.source]
type = "flathub"
ref = "com.heroicgameslauncher.hgl"

[[apps]]
id = "lutris"
name = "Lutris"
summary = "All your games from every store in one list"
description = """Gathers games from Steam, Epic, GOG, Battle.net and others \
into a single library, and knows the specific tweaks a lot of older or \
fussier games need to run properly on Linux.

Worth it if you buy games in several different places and want one list \
instead of four. It overlaps with Heroic — most people settle on one or the \
other rather than both."""
category = "gaming"
hardware = []

[apps.source]
type = "flathub"
ref = "net.lutris.Lutris"

[[apps]]
id = "prismlauncher"
name = "Prism Launcher"
summary = "Play and organise Minecraft (Java Edition)"
description = """A friendlier way to run Minecraft Java Edition. You can keep \
several separate setups side by side — a plain one, a heavily modded one for \
the kids, another for a server you play on — without any of them interfering \
with each other. It installs mod packs for you.

You still sign in with your own Minecraft account; this does not include the \
game itself."""
category = "gaming"
hardware = []

[apps.source]
type = "flathub"
ref = "org.prismlauncher.PrismLauncher"

[[apps]]
id = "bottles"
name = "Bottles"
summary = "Run Windows programs that have no Linux version"
description = """For that one Windows program you still need. Each program \
gets its own private, self-contained space, so a badly behaved one cannot \
disturb anything else on your system.

For games, Steam and Heroic usually do a better job — reach for Bottles when \
it is ordinary Windows software rather than a game."""
category = "gaming"
hardware = []

[apps.source]
type = "flathub"
ref = "com.usebottles.bottles"

[[apps]]
id = "protonup-qt"
name = "ProtonUp-Qt"
summary = "Extra compatibility versions for stubborn games"
description = """Steam runs Windows games through a translation layer called \
Proton. Occasionally a game behaves better on a community-improved version \
of it, usually called GE-Proton. This installs those extra versions; you then \
pick one for a specific game in Steam's own settings.

Only worth installing if a particular game is misbehaving. If everything you \
play already works, you do not need this."""
category = "gaming"
hardware = []

[apps.source]
type = "flathub"
ref = "net.davidotek.pupgui2"

# ── Emulation ─────────────────────────────────────────────────────────

[[apps]]
id = "emudeck"
name = "EmuDeck"
summary = "Set up retro game consoles in one go"
description = """Sets up everything needed to play retro console games: it \
installs the emulators, creates a tidy folder layout for your game files, and \
adds the games to Steam so they show up next to everything else.

After installing, EmuDeck opens its own setup window where you choose which \
consoles you want — follow that through to finish. You provide the game files \
yourself; none are included."""
category = "emulation"
hardware = []

[apps.source]
type = "ujust"
# Verified against Bazzite's 82-bazzite-apps.just on 2026-07-30. The recipe
# is `get-emudeck ACTION=""` (aliased to install-emudeck) and takes
# status | install | uninstall. Called with no action it opens a menu that
# needs a terminal, which is why args is required here.
recipe = "install-emudeck"
args = ["install"]
uninstall_args = ["uninstall"]
# Mirrors the recipe's own status check: it installs an AppImage into
# ~/Applications. (The old /home/.emudeck path was never right.)
check_cmd = ["bash", "-c", 'compgen -G "$HOME/Applications/*EmuDeck*.AppImage" > /dev/null']

[[apps]]
id = "githublauncher"
name = "GitHub Launcher"
summary = "Install fan-made PC versions of classic games"
description = """A handful of classic games have been painstakingly rebuilt \
to run natively on a modern PC, rather than being emulated. They look and run \
far better than emulation does. This launcher finds those projects, installs \
them, and keeps them up to date.

You must legally own the original game and supply its files yourself. This is \
a niche, enthusiast thing — most people can skip it."""
category = "emulation"
hardware = []

[apps.source]
type = "github"
repo = "SirDiabo/GithubLauncher"
# Verified against the real v1.73 release on 2026-07-30: matches exactly one
# asset (GitHubLauncher-v1.73-Linux-X64.zip); the ARM64 and Windows builds
# correctly do not match. If upstream renames these, Ignis fails loudly and
# names every asset it saw rather than guessing.
#
# The Linux build is a self-contained single-file .NET publish (the runtime
# is embedded in the 83 MB executable - confirmed, no separate .dll files),
# so it needs NO .NET installation on Bazzite. Its three sibling .so files
# are Avalonia's native deps and must be extracted alongside it.
asset_pattern = 'linux-x64\.zip$'
install_kind = "zip"

# ── Media ─────────────────────────────────────────────────────────────

[[apps]]
id = "vlc"
name = "VLC"
summary = "The video player that plays absolutely everything"
description = """The same VLC you probably used on Windows — the orange \
traffic cone. It plays virtually any video or audio file you throw at it, \
along with DVDs and network streams, using the ordinary familiar controls.

A safe default if you simply want to double-click a video and watch it."""
category = "media"
hardware = []

[apps.source]
type = "flathub"
ref = "org.videolan.VLC"

[[apps]]
id = "mpv"
name = "mpv"
summary = "A fast, minimal video player for keyboard users"
description = """An extremely light and capable player that deliberately has \
almost no buttons — you drive it with the keyboard and it plays anything \
without fuss. Popular with people who find normal players cluttered.

If you would rather have visible on-screen controls, install VLC instead."""
category = "media"
hardware = []

[apps.source]
type = "flathub"
ref = "io.mpv.Mpv"

[[apps]]
id = "handbrake"
name = "HandBrake"
summary = "Shrink videos so they take up less space"
description = """Converts videos into much smaller files that still look \
good — handy when phone recordings or ripped discs are filling your drive. It \
also converts awkward formats into something a TV or tablet will actually \
play.

The same HandBrake as on Windows, and it can use your graphics card to do the \
work quickly."""
category = "media"
hardware = []

[apps.source]
type = "flathub"
ref = "fr.handbrake.ghb"

[[apps]]
id = "nas-mount"
name = "Connect to a NAS"
summary = "Reach the files on your network drive from this PC"
description = """Connects this computer to a network drive (a NAS) so its \
films, music, books and photos appear as an ordinary folder you can open, \
add to and tidy up like any other.

The connection is remembered, so it comes back on its own after a restart. \
It also connects only when something actually reads the folder, which means \
a NAS that is switched off or asleep never holds up your computer starting.

Before installing this, turn on NFS on the NAS and allow this computer's \
address. On a Synology that is Control Panel, then File Services, then NFS; \
and then NFS Permissions on the shared folder. You will need the mount path \
it shows you, which looks like /volume1/Media."""
category = "system"
hardware = []

[apps.source]
type = "script"
file = "nas-mount.sh"
# {mount_point} is filled in from the user's answer. Before they have
# answered it stays literal, the command fails, and the app correctly reads
# as not installed.
check_cmd = ["bash", "-c", 'systemctl is-enabled "$(systemd-escape --path --suffix=automount "{mount_point}")" >/dev/null 2>&1']

[[apps.settings]]
key = "nas_host"
label = "NAS address"
type = "text"
default = ""
help = "The IP address of your NAS, for example 192.168.1.50"

[[apps.settings]]
key = "export_path"
label = "Folder on the NAS"
type = "path"
default = ""
help = "The mount path shown in the NAS's NFS Permissions window, for example /volume1/Media"

[[apps.settings]]
key = "mount_point"
label = "Show it on this PC as"
type = "path"
default = "/mnt/nas"
help = "Where the NAS appears locally. /mnt/nas suits most people."

[[apps]]
id = "komga"
name = "Komga"
summary = "Your own server for comics, manga and e-books"
description = """Turns this computer into a library for your comics, manga \
and e-books. You read them in a web browser — on this PC, a tablet, or a \
phone — and Komga keeps track of what you have read and where you got to.

Unlike most things here, Komga has no window of its own: it runs quietly in \
the background and you use it through your browser. Ignis sets it up to \
start on its own and gives you a link to open it.

Point it at the folder holding your books. If those live on a NAS, connect \
to that first — Komga can only read what this computer can already see. \
When Komga asks where your library is, the folder you chose appears inside \
it as /books. Komga reads your files and never changes them."""
category = "media"
hardware = []

[apps.source]
type = "container"
image = "docker.io/gotson/komga:latest"
port = 25600
# Read-only on purpose: Komga only ever reads your library, and keeps its own
# database in the config volume Ignis creates for it.
volumes = ["{books_dir}:/books:ro"]

[[apps.settings]]
key = "books_dir"
label = "Where your books are"
type = "path"
default = "/mnt/nas"
help = "The folder holding your comics and e-books. Use the NAS folder if you connected one."

[[apps]]
id = "handbrake-av1-presets"
name = "AV1 presets for HandBrake"
summary = "Ready-made high-quality AV1 conversion settings"
description = """Adds three ready-made conversion settings to HandBrake for \
making high-quality video that takes up far less space.

AV1 is a modern video format that keeps more detail at a smaller size than \
older ones, in exchange for taking longer to convert. The three settings are \
tuned for different material: one for live action, one for older live action, \
and one for animation, which needs different handling to avoid smearing.

All of them keep your original audio untouched and add one widely-compatible \
surround track next to it, so the result plays on almost anything.

Install HandBrake first — this adds settings to it rather than being a \
separate program. Close HandBrake before installing these."""
category = "media"
hardware = []

[apps.source]
type = "script"
file = "handbrake-av1-presets.sh"
# The Flatpak HandBrake keeps its presets under ~/.var/app, not ~/.config.
check_cmd = ["bash", "-c", 'grep -q "(Live) AV1 Preset" "$HOME/.var/app/fr.handbrake.ghb/config/ghb/presets.json" 2>/dev/null']

[[apps]]
id = "jellyfin-server"
name = "Jellyfin Server"
summary = "Host your films and shows for every screen you own"
description = """Turns this computer into your own private streaming \
service. Jellyfin Server holds your films, shows and music, and everything \
else in the house — TVs, phones, tablets, other computers — watches from it \
using the Jellyfin app. No subscription, and nothing leaves your home.

Like Komga, it has no window of its own: it runs quietly in the background \
and you manage it in your web browser. Ignis starts it for you and the Open \
button takes you to its setup, where you sign in and pick your libraries. \
When it asks where your media is, the folder you chose appears inside it \
as /media.

If your films live on a NAS, connect to that first — the server can only \
share what this computer can already see. It reads your files and never \
changes them. To watch on this same PC, also install Jellyfin Media Player."""
category = "media"
hardware = []

[apps.source]
type = "container"
image = "docker.io/jellyfin/jellyfin:latest"
port = 8096
# The library is read-only on purpose; the cache is Jellyfin's own scratch
# space (artwork, transcodes) and lives under the user's home. %h is
# expanded by systemd when the unit runs.
volumes = [
  "{media_dir}:/media:ro",
  "%h/.local/share/ignis/jellyfin-server/cache:/cache:Z",
]

[[apps.settings]]
key = "media_dir"
label = "Where your films and shows are"
type = "path"
default = "/mnt/nas"
help = "The folder holding your media. Use the NAS folder if you connected one."

[[apps]]
id = "jellyfin-player"
name = "Jellyfin Media Player"
summary = "Watch your own movie and TV collection"
description = """Jellyfin is a free way to keep your own films and shows on a \
computer at home and watch them on any screen in the house — think of it as \
your own private Netflix. This is the app you watch with.

It needs a Jellyfin server running somewhere on your network. If this \
computer is going to be the one holding the films, install Jellyfin Server \
from this list and this player can connect to it right here at \
http://localhost:8096."""
category = "media"
hardware = []

[apps.source]
type = "flathub"
ref = "com.github.iwalton3.jellyfin-media-player"

# ── Streaming and recording ───────────────────────────────────────────

[[apps]]
id = "gpu-screen-recorder"
name = "GPU Screen Recorder"
summary = "Save a clip of what just happened"
description = """Records your screen using your graphics card, so it barely \
affects game performance. Its best trick is replay mode: it quietly keeps the \
last few minutes in memory, and a hotkey saves them to a file — the same idea \
as the clip button on a console, or GeForce Experience on Windows.

Far simpler than OBS if all you want is to capture good moments."""
category = "streaming"
hardware = []

[apps.source]
type = "flathub"
ref = "com.dec05eba.gpu_screen_recorder"

[[apps]]
id = "obs"
name = "OBS Studio"
summary = "Record your screen or broadcast live"
description = """The standard tool for recording gameplay or going live on \
Twitch and YouTube. It can do almost anything — overlays, multiple cameras, \
scene switching — and is correspondingly fiddly to learn.

If you only want to save clips of gameplay, GPU Screen Recorder is much \
easier."""
category = "streaming"
hardware = []

[apps.source]
type = "flathub"
ref = "com.obsproject.Studio"

[[apps]]
id = "sunshine"
name = "Sunshine game streaming"
summary = "Stream this PC's games to your other devices"
description = """Lets this computer do the hard work while you play its games \
from somewhere else in the house — a laptop, a TV, a tablet or a handheld. \
The picture is sent over your home network with very little delay.

Install Moonlight on whatever device you want to play on. Sunshine sets \
itself up to start automatically with your computer."""
category = "streaming"
hardware = []

[apps.source]
type = "ujust"
# Verified against Bazzite's 82-bazzite-sunshine.just on 2026-07-30. The
# recipe takes status | enable | enable-beta | update | disable | uninstall
# | portal; "enable" installs the Flatpak and enables the user service,
# which is what Ignis wants. Without an action it opens a menu needing a
# terminal — that is the "failed with exit code 1" people hit.
recipe = "setup-sunshine"
args = ["enable"]
uninstall_args = ["disable"]
# The recipe considers Sunshine set up when its user service is enabled.
check_cmd = ["systemctl", "is-enabled", "--user", "app-dev.lizardbyte.app.Sunshine"]

[[apps]]
id = "moonlight"
name = "Moonlight"
summary = "Play games running on another computer"
description = """The other half of game streaming. Install this on the machine \
you want to play *on*, and it connects to a gaming PC elsewhere in the house \
that is running Sunshine.

The game runs over there; the picture comes to you. Useful for playing \
demanding games on a laptop or a TV that could never run them by itself."""
category = "streaming"
hardware = []

[apps.source]
type = "flathub"
ref = "com.moonlight_stream.Moonlight"

# ── Chat ──────────────────────────────────────────────────────────────

[[apps]]
id = "vesktop"
name = "Vesktop (Discord)"
summary = "Discord, with screen sharing that carries sound"
description = """A community-built version of Discord that fixes the main \
annoyance on Linux: when you share your screen, your friends can actually \
hear the game.

It is the same Discord — your account, your servers, your friends — just a \
better app for it. Recommended over the official version if you ever share \
your screen."""
category = "communication"
hardware = []

[apps.source]
type = "flathub"
ref = "dev.vencord.Vesktop"

[[apps]]
id = "discord"
name = "Discord"
summary = "Voice and text chat for gaming groups"
description = """The chat app most gaming groups use: voice calls, text \
channels, and screen sharing. This is the official version.

One catch — sharing your screen with sound does not work properly here on \
Linux. If you need that, install Vesktop instead; it logs into the same \
account."""
category = "communication"
hardware = []

[apps.source]
type = "flathub"
ref = "com.discordapp.Discord"

# ── System ────────────────────────────────────────────────────────────

[[apps]]
id = "tailscale"
name = "Tailscale"
summary = "Reach this computer securely from anywhere"
description = """Creates a private network between your own devices, so your \
phone or laptop can reach this computer from anywhere in the world as though \
you were sat at home — without opening any ports on your router or putting \
anything on the public internet.

The reason to want it: if this machine is holding your films, music or books, \
this is how you get at them while you are out, safely.

Bazzite already includes Tailscale — this switches it on. You will be asked \
for your password, because starting a system service needs administrator \
rights. One step is left to you afterwards: run `tailscale up` in a terminal \
and open the link it prints. Signing in has to happen in a browser, so no \
installer can do it for you, and you only do it once."""
category = "system"
hardware = []

[apps.source]
type = "script"
file = "tailscale-enable.sh"
check_cmd = ["systemctl", "is-enabled", "tailscaled.service"]

[[apps]]
id = "mission-center"
name = "Mission Center"
summary = "See what is slowing your computer down"
description = """The equivalent of Task Manager on Windows. It shows how hard \
your processor, memory, graphics card, drives and network are working, and \
which programs are responsible.

The first place to look when the machine feels sluggish or a fan will not \
stop spinning."""
category = "system"
hardware = []

[apps.source]
type = "flathub"
ref = "io.missioncenter.MissionCenter"

[[apps]]
id = "flatseal"
name = "Flatseal"
summary = "Give an app permission to see your files"
description = """Apps on Linux run inside a protective box and can only reach \
the folders they have been allowed to. Usually that is invisible and fine — \
but occasionally a game launcher cannot see your second hard drive, or a \
program cannot find your controller.

This is where you grant that permission. A repair tool: you will not need it \
until you do, and then you will be very glad it is there."""
category = "system"
hardware = []

[apps.source]
type = "flathub"
ref = "com.github.tchx84.Flatseal"

[[apps]]
id = "openrgb"
name = "OpenRGB"
summary = "Control the lighting inside your PC"
description = """Sets the colours and effects of RGB lighting in your case, \
fans, memory, keyboard and mouse — all from one place, instead of a separate \
app from each manufacturer.

This is the Linux answer to tools like iCUE, Aura Sync or Mystic Light. Purely \
cosmetic; skip it if your machine has no lighting."""
category = "system"
hardware = []

[apps.source]
type = "ujust"
# Verified against Bazzite's 82-bazzite-apps.just on 2026-07-30: the recipe
# is `openrgb ACTION=""` (aliased to install-openrgb), same
# status | install | uninstall shape as EmuDeck, installing an AppImage
# into ~/Applications.
recipe = "install-openrgb"
args = ["install"]
uninstall_args = ["uninstall"]
check_cmd = ["bash", "-c", 'compgen -G "$HOME/Applications/*OpenRGB*.AppImage" > /dev/null']

[[apps]]
id = "coolercontrol"
name = "CoolerControl"
summary = "Make your PC quieter, or keep it cooler"
description = """Controls how fast your case and cooler fans spin depending on \
temperature — near-silent when you are browsing, ramping up only when a game \
needs it.

Worth installing if your computer is noisier than you would like."""
category = "system"
hardware = []

[apps.source]
type = "flathub"
ref = "org.coolercontrol.CoolerControl"

[[apps]]
id = "lact"
name = "LACT"
summary = "Monitor and tune an AMD graphics card"
description = """Shows what your AMD graphics card is doing — temperature, \
speed, power draw — and lets you adjust its fan curve or power limit.

Mainly useful if your PC runs hot or loud under load. It is perfectly safe to \
install and simply look at, and safe to ignore entirely."""
category = "system"
hardware = ["amd"]

[apps.source]
type = "flathub"
ref = "io.github.ilya_zlobintsev.LACT"
